# Deploys devtest (static site + site Worker, Stripe TEST mode) to
# https://devtest.zagware.io after CI passes on main.
# Needs repo secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and repo variable
# DEVTEST_CLOUDFLARE=true. Stripe secrets live on the Worker (wrangler secret put), not here.
name: Devtest → Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devtest-cloudflare
  cancel-in-progress: false

jobs:
  ci:
    if: vars.DEVTEST_CLOUDFLARE == 'true'
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: devtest
      url: https://devtest.zagware.io/
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: sites/devtest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - run: node ../../bin/zsite.mjs build . --target cloudflare --strict
      - run: npx wrangler d1 migrations apply DB --remote
      - run: npx wrangler deploy
      - name: Smoke test
        run: node ../../bin/zsite.mjs smoke https://devtest.zagware.io/ --api
