# Production: deploy to Cloudflare (Workers static assets + optional Worker API).
# Runs on version tags (v1.2.3) or manually. Needs repo secrets
# CLOUDFLARE_API_TOKEN (Workers Scripts:Edit, D1:Edit, Zone routes) and CLOUDFLARE_ACCOUNT_ID.
name: Deploy (Cloudflare)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (cloudflare target)
        run: npx zsite build . --target cloudflare --strict
      - name: Apply D1 migrations (shops only)
        if: hashFiles('worker.mjs') != ''
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy
        run: npx wrangler deploy
      - name: Smoke test
        run: |
          url=$(node -e 'import("./site.config.mjs").then(m => console.log(m.default.urls.production))')
          npx zsite smoke "$url" $([ -f worker.mjs ] && echo --api)
